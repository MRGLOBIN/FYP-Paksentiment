name: Python Release Build

on:
  push:
    # Trigger this workflow ONLY when a tag is pushed (e.g: git push --tags)
    tags:
      - "v*"

jobs:
  get_package_version:
    uses: ./.github/workflows/get_version.yaml

  build-and-release:
    runs-on: ubuntu-latest
    needs: [get_package_version] # ensures it ran ONLY after the version is retrived
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for versioning/tag detection

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        run: pip install uv

      - name: Build Source and Wheel Distributions
        run: uv build

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.get_package_version.outputs.package_version }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
